name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.3

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;20.0.5594570" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/20.0.5594570" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmake/3.10.2.4988404/bin" >> $GITHUB_PATH

      - name: Generate Gradle project
        run: |
          sed -i -E 's/(com\.android\.tools\.build:gradle:)[0-9.]+/\13.5.0/' bldsys/cmake/template/gradle/build.gradle.in
          sed -i 's/set(VKB_WARNINGS_AS_ERRORS ON/set(VKB_WARNINGS_AS_ERRORS OFF/' bldsys/cmake/global_options.cmake
          sed -i 's/arm64-v8a;armeabi-v7a/arm64-v8a/' bldsys/scripts/generate_android_gradle.sh
          chmod +x bldsys/scripts/generate_android_gradle.sh
          ./bldsys/scripts/generate_android_gradle.sh
          echo "sdk.dir=$ANDROID_HOME" > build/android_gradle/local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.10.2.4988404" >> build/android_gradle/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/20.0.5594570" >> build/android_gradle/local.properties

      - name: Build
        run: |
          set -o pipefail
          cd build/android_gradle
          gradle assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors
        if: failure()
        run: |
          grep -n -B1 -A8 "FAILED:" build.log | head -60
          grep -n "error:" build.log | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/android_gradle/build/outputs/apk/debug/*.apk
